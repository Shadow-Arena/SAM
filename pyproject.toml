[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sam3-segment-studio"
version = "0.1.0"
description = "Interactive SAM3 image segmentation app — text, box, point or mixed prompts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shadow-Arena" }]
dependencies = [
    "transformers>=5.0.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "numpy>=1.24",
    "pillow>=10.0",
    "requests>=2.31",
]

[project.scripts]
sam3-app = "app.main:main"
sam3-segment = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "build", "dist", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]
